<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Lets the CSS collapse the mobile menu only when the script can open it -->
    <script>document.documentElement.className += ' js';</script>

    <!-- Title, description, canonical URL and social sharing tags (jekyll-seo-tag) -->
    {% seo %}

    <!-- Feed autodiscovery (jekyll-feed) -->
    {% feed_meta %}

    {% if site.mastodon_url %}
    <!-- Mastodon: rel="me" verifies this site on the profile; fediverse:creator credits shared posts -->
    <link rel="me" href="{{ site.mastodon_url }}">
    <meta name="fediverse:creator" content="{{ site.mastodon_handle }}">
    {% endif %}

    <!-- Site CSS -->
    <link rel="stylesheet" href="{{ "/css/clean-blog.css" | prepend: site.baseurl }}">

    <!-- Syntax highlighting CSS -->
    <link rel="stylesheet" href="{{ "/css/syntax.css" | prepend: site.baseurl }}">

    <!-- Custom Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800">

</head>
