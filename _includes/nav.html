<!-- Navigation -->
<nav class="site-nav" aria-label="Main">
    <div class="site-nav-inner">
        <a class="site-nav-brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
        <button type="button" class="site-nav-toggle" aria-controls="site-nav-menu" aria-expanded="false">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
        </button>
        <ul class="site-nav-menu" id="site-nav-menu">
            <li>
                <a href="{{ site.baseurl }}/">Home</a>
            </li>
            {% for page in site.pages %}{% if page.title and page.url != '/404.html' %}
            <li>
                <a href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a>
            </li>
            {% endif %}{% endfor %}
        </ul>
    </div>
</nav>
